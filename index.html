<!DOCTYPE html>
<html>
<head>
  <title>Simple Quiz App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 flex items-center justify-center h-screen text-white">

<div class="bg-gray-800 p-6 rounded-xl w-96 text-center shadow-lg">

  <h1 class="text-2xl font-bold mb-4">Quiz App</h1>

  <p id="progress" class="mb-2 text-sm text-gray-300"></p>

  <h2 id="question" class="mb-4 text-lg"></h2>

  <div id="options" class="space-y-2"></div>

  <button onclick="nextQuestion()" 
    class="mt-4 bg-blue-500 px-4 py-2 rounded hover:bg-blue-600">
    Next ➜
  </button>

  <p id="score" class="mt-4 text-green-400"></p>

</div>

<script>
const quiz = [
  {
    question: "What does HTML stand for?",
    options: ["Hyper Text Markup Language", "High Text Machine Language", "Hyper Tool Markup Language", "Home Text Markup Language"],
    answer: 0
  },
  {
    question: "Which language is used for styling?",
    options: ["HTML", "Python", "CSS", "Java"],
    answer: 2
  },
  {
    question: "Which is a JavaScript framework?",
    options: ["Django", "React", "Flask", "Laravel"],
    answer: 1
  },
  {
    question: "Which tag is used for paragraph?",
    options: ["<p>", "<h1>", "<div>", "<span>"],
    answer: 0
  },
  {
    question: "Which is used to store data in browser?",
    options: ["Session", "LocalStorage", "Database", "File"],
    answer: 1
  }
];

let current = 0;
let score = 0;
let selected = null;

function loadQuestion() {
  selected = null;
  document.getElementById("progress").innerText = 
    `Question ${current + 1} / ${quiz.length}`;

  document.getElementById("question").innerText = 
    quiz[current].question;

  let optionsHTML = "";
  quiz[current].options.forEach((opt, index) => {
    optionsHTML += `
      <button onclick="selectOption(${index})" 
        class="w-full bg-gray-700 p-2 rounded hover:bg-gray-600 option">
        ${opt}
      </button>`;
  });

  document.getElementById("options").innerHTML = optionsHTML;
}

function selectOption(index) {
  selected = index;

  let buttons = document.querySelectorAll(".option");
  buttons.forEach(btn => btn.classList.remove("bg-blue-500"));

  buttons[index].classList.add("bg-blue-500");
}

function nextQuestion() {
  if (selected === null) {
    alert("Please select an option!");
    return;
  }

  if (selected === quiz[current].answer) {
    score++;
  }

  current++;

  if (current < quiz.length) {
    loadQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById("question").innerText = 
    "🎉 Quiz Completed!";

  document.getElementById("options").innerHTML = "";

  document.getElementById("progress").innerText = "";

  document.getElementById("score").innerText = 
    `Your Score: ${score} / ${quiz.length}`;
}

loadQuestion();
</script>

</body>
</html>
